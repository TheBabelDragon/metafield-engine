<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaField Engine</title>
<style>
:root{color-scheme:dark}html,body{margin:0;height:100%;background:#04060a;color:#d7e0ea;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#wrap{display:grid;grid-template-rows:52px 1fr 28px;height:100%}
header,footer{display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b0f14}
header{border-bottom:1px solid #1b2430}footer{border-top:1px solid #1b2430;color:#6d7f90;font-size:12px}
h1{font-size:13px;letter-spacing:.18em;margin:0;font-weight:650}
.badge{padding:3px 8px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:.08em}
.live{background:#12351f;color:#5dffa3}.syn{background:#3a2a10;color:#ffc46b}.wait{background:#222;color:#889}
.meta{margin-left:auto;opacity:.8}.tog{display:flex;border:1px solid #2a3644;border-radius:8px;overflow:hidden}
.tog button{background:#121820;color:#9aafc0;border:0;padding:6px 12px;cursor:pointer;font-weight:700;letter-spacing:.08em;font-size:11px}
.tog button.on-syn{background:#3a2a10;color:#ffc46b}.tog button.on-est{background:#12351f;color:#5dffa3}
#stage{position:relative;min-height:0}#world{width:100%;height:100%;display:block;background:#05080d}
#side,#insp{position:absolute;top:12px;width:250px;background:rgba(8,12,18,.9);border:1px solid #1c2733;border-radius:10px;padding:12px}
#side{left:12px}#insp{right:12px}h2{margin:0 0 8px;font-size:10px;letter-spacing:.14em;color:#8aa0b5}
canvas.panel{width:100%;display:block;background:#080b10;border-radius:6px}
.meter{display:grid;grid-template-columns:54px 1fr 36px;gap:6px;align-items:center;margin:6px 0}
.bar{height:8px;background:#18202a;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee6a6,#7cff6b)}
.hint{color:#8aa0b5;font-size:12px;margin-top:8px}#insp div{padding:5px 0;border-bottom:1px solid #1a2430}
</style>
<div id="wrap"><header><h1>METAFIELD ENGINE</h1><div class="tog"><button id="btn-syn">SYN</button><button id="btn-est">EST</button></div>
<span id="badge" class="badge wait">WAIT</span><span id="src"></span><span class="meta" id="stats"></span></header>
<div id="stage"><canvas id="world"></canvas>
<div id="side"><h2>SUBCARRIERS</h2><canvas id="bars" class="panel" width="420" height="86"></canvas>
<h2 style="margin-top:10px">WATERFALL</h2><canvas id="fall" class="panel" width="420" height="110"></canvas>
<div class="meter"><span>rssi</span><div class="bar"><i id="m_rssi"></i></div><span id="t_rssi">—</span></div>
<div class="meter"><span>energy</span><div class="bar"><i id="m_e"></i></div><span id="t_e">—</span></div>
<div class="meter"><span>motion</span><div class="bar"><i id="m_m"></i></div><span id="t_m">—</span></div>
<div class="hint" id="hint">SYN demo · EST tracked occupancy</div></div>
<div id="insp"><h2>TRACKS</h2><div id="elist">toggle EST</div><h2 style="margin-top:12px">WORLD</h2><div id="list"></div></div></div>
<footer>dynamic field · drag orbit · wheel zoom · double-click reset</footer></div>
<script>
const world=document.getElementById('world'),wctx=world.getContext('2d');
const bars=document.getElementById('bars'),bctx=bars.getContext('2d');
const fall=document.getElementById('fall'),fctx=fall.getContext('2d');
let yaw=0.9,pitch=0.78,zoom=13,dragging=false,lx=0,ly=0,state={packets:0,world:[],latest:{},estimate:{},view:'syn'};
const water=[],parts=[],shown={};
function resize(){const r=world.parentElement.getBoundingClientRect();world.width=r.width*devicePixelRatio;world.height=r.height*devicePixelRatio;}
addEventListener('resize',resize);resize();
world.onpointerdown=e=>{dragging=true;lx=e.clientX;ly=e.clientY;world.setPointerCapture(e.pointerId)};
world.onpointerup=()=>dragging=false;
world.onpointermove=e=>{if(!dragging)return;yaw+=(e.clientX-lx)*0.007;pitch=Math.max(-1.45,Math.min(1.45,pitch-(e.clientY-ly)*0.007));lx=e.clientX;ly=e.clientY};
world.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(6,Math.min(36,zoom+e.deltaY*0.02))},{passive:false});
world.ondblclick=()=>{yaw=0.9;pitch=0.78;zoom=13};
document.getElementById('btn-syn').onclick=()=>fetch('/mode?view=syn',{cache:'no-store'});
document.getElementById('btn-est').onclick=()=>fetch('/mode?view=est',{cache:'no-store'});
function clamp01(v){return Math.max(0,Math.min(1,+v||0))}
function project(x,y,z){const r=zoom,eyeY=r*Math.sin(pitch),ch=r*Math.cos(pitch),eyeX=ch*Math.sin(yaw),eyeZ=ch*Math.cos(yaw);
 const fx0=-eyeX,fy0=0.45-eyeY,fz0=-eyeZ,fl=Math.hypot(fx0,fy0,fz0)||1,fx=fx0/fl,fy=fy0/fl,fz=fz0/fl;
 let rx=-fz,rz=fx,rl=Math.hypot(rx,rz); if(rl<1e-4){rx=1;rz=0;rl=1} rx/=rl;rz/=rl;
 const ux=-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy; const dx=x-eyeX,dy=y-eyeY,dz=z-eyeZ;
 const cx=dx*rx+dz*rz,cy=dx*ux+dy*uy+dz*uz,cz=dx*fx+dy*fy+dz*fz; const f=(world.height*0.72)/Math.max(0.35,cz);
 return [world.width/2+cx*f,world.height/2-cy*f,cz];}
function line(a,b,col,w){wctx.strokeStyle=col;wctx.lineWidth=w||1;wctx.beginPath();wctx.moveTo(a[0],a[1]);wctx.lineTo(b[0],b[1]);wctx.stroke()}
function cube(x,y,z,sx,sy,sz,col,a){const p=(dx,dy,dz)=>project(x+dx,y+dy,z+dz);
 const pts=[p(-sx,0,-sz),p(sx,0,-sz),p(sx,0,sz),p(-sx,0,sz),p(-sx,sy,-sz),p(sx,sy,-sz),p(sx,sy,sz),p(-sx,sy,sz)];
 const faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
 const order=faces.map((f,i)=>({i,z:(pts[f[0]][2]+pts[f[2]][2])/2})).sort((a,b)=>a.z-b.z);
 for(const o of order){const f=faces[o.i]; if(pts[f[0]][2]<0.2&&pts[f[2]][2]<0.2)continue;
  wctx.beginPath();wctx.moveTo(pts[f[0]][0],pts[f[0]][1]);for(let k=1;k<4;k++)wctx.lineTo(pts[f[k]][0],pts[f[k]][1]);wctx.closePath();
  wctx.globalAlpha=a==null?0.9:a;wctx.fillStyle=col;wctx.fill();wctx.globalAlpha=1;wctx.strokeStyle='rgba(255,255,255,.1)';wctx.stroke();}}
function lerpShown(){const blobs=(state.estimate&&state.estimate.blobs)||[],seen={};
 for(const b of blobs){const id=b.id||0;seen[id]=1; if(!shown[id]) shown[id]={x:b.x,z:b.z,rx:b.rx,rz:b.rz,energy:b.energy,motion:b.motion,trail:b.trail||[],contour:b.contour||[]};
  const s=shown[id]; s.x+=((b.x||0)-s.x)*0.18; s.z+=((b.z||0)-s.z)*0.18; s.rx+=((b.rx||0.4)-s.rx)*0.12; s.rz+=((b.rz||0.4)-s.rz)*0.12;
  s.energy+=((b.energy||0)-s.energy)*0.15; s.motion+=((b.motion||0)-s.motion)*0.15; s.trail=b.trail||s.trail; s.contour=b.contour||s.contour; s.live=!!(state.estimate&&state.estimate.live);}
 for(const k of Object.keys(shown)) if(!seen[k]) delete shown[k];}
function spawnParts(){const est=state.estimate||{},grid=est.grid||[],gw=est.gw||0,gz=est.gz||0; if(!gw||grid.length!==gw*gz)return;
 let peak=1e-4; for(const v of grid) if(v>peak)peak=v; if(Math.random()<0.4){const i=Math.floor(Math.random()*grid.length),v=grid[i]/peak;
  if(v>0.25) parts.push({x:(i%gw+0.5)/gw*6.5-3.25,z:(Math.floor(i/gw)+0.5)/gz*6.5-3.25,y:0.05,vy:0.01+v*0.03,life:1,v});}
 for(const p of parts){p.y+=p.vy;p.life-=0.012;} for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);}
function drawEstimate(t){const est=state.estimate||{},grid=est.grid||[],gw=est.gw||0,gz=est.gz||0,live=!!est.live,pulse=0.5+0.5*Math.sin(t*3);
 if(gw&&grid.length===gw*gz){let peak=1e-4; for(const v of grid) if(v>peak)peak=v; const span=6.5,cell=span/gw;
  for(let z=0;z<gz;z++) for(let x=0;x<gw;x++){const v=grid[z*gw+x]/peak; if(v<0.14)continue;
   const a=0.07+v*0.5*(0.75+0.25*pulse); cube((x+0.5)/gw*span-span/2,0,(z+0.5)/gz*span-span/2,cell*0.46,0.02+v*(0.55+0.25*pulse),cell*0.46,live?('rgba(46,230,166,'+a+')'):('rgba(255,180,70,'+a+')'),0.8);}}
 const sweep=t*0.7; for(let i=0;i<32;i++){const a0=sweep+i*0.04,r=3.1; wctx.globalAlpha=0.04+0.1*(i/32); line(project(Math.cos(a0)*r,0.01,Math.sin(a0)*r),project(Math.cos(a0+0.04)*r,0.01,Math.sin(a0+0.04)*r),live?'#5dffa3':'#ffc46b'); wctx.globalAlpha=1;}
 for(const p of parts){const q=project(p.x,p.y,p.z); if(q[2]<0.3)continue; wctx.globalAlpha=p.life*0.8; wctx.fillStyle=live?'#9bffd0':'#ffd48a'; wctx.beginPath(); wctx.arc(q[0],q[1],2+p.v*3,0,Math.PI*2); wctx.fill(); wctx.globalAlpha=1;}
 for(const id of Object.keys(shown)){const b=shown[id],tr=b.trail||[];
  if(tr.length>=4){wctx.beginPath(); for(let k=0;k<tr.length;k+=2){const p=project(tr[k],0.05,tr[k+1]); k?wctx.lineTo(p[0],p[1]):wctx.moveTo(p[0],p[1]);} wctx.strokeStyle=live?'rgba(93,255,163,.45)':'rgba(255,196,107,.45)'; wctx.lineWidth=2*devicePixelRatio; wctx.stroke();}
  const c=b.contour||[]; if(c.length>=4){const grow=1+0.06*Math.sin(t*4+Number(id)); wctx.beginPath();
   for(let k=0;k<c.length;k+=2){const p=project(b.x+(c[k]-b.x)*grow,0.05,b.z+(c[k+1]-b.z)*grow); k?wctx.lineTo(p[0],p[1]):wctx.moveTo(p[0],p[1]);}
   wctx.closePath(); wctx.strokeStyle=live?'#5dffa3':'#ffc46b'; wctx.lineWidth=(1.8+b.motion*4)*devicePixelRatio; wctx.stroke(); wctx.fillStyle=live?'rgba(93,255,163,.12)':'rgba(255,196,107,.12)'; wctx.fill();}
  const h=0.2+b.energy*(0.9+0.25*Math.sin(t*5+Number(id))); cube(b.x,0,b.z,Math.max(0.1,b.rx*0.28),h,Math.max(0.1,b.rz*0.28),live?'#2ee6a6':'#c9842a',0.62);
  const lab=project(b.x,h+0.15,b.z); if(lab[2]>0.4){wctx.fillStyle='#e8f4ee';wctx.font=(11*devicePixelRatio)+'px ui-sans-serif'; wctx.fillText('T'+id+' E='+b.energy.toFixed(2),lab[0]+4,lab[1]);}}
}
function drawWorld(t){wctx.fillStyle='#05080d';wctx.fillRect(0,0,world.width,world.height);
 for(let i=-6;i<=6;i++){line(project(i,0,-6),project(i,0,6),'#15202c');line(project(-6,0,i),project(6,0,i),'#15202c');}
 const estOn=state.view==='est'; if(estOn) drawEstimate(t);
 const ents=(state.world||[]).slice().sort((a,b)=>project(a.x||0,0,a.z||0)[2]-project(b.x||0,0,b.z||0)[2]);
 for(const ent of ents){ if(estOn&&ent.kind!=='sensor') continue; const bob=ent.kind==='sensor'?0.08*Math.sin(t*4+(ent.id||0)):0;
  cube(ent.x||0,(ent.y||0)+bob,ent.z||0,ent.sx||0.3,ent.sy||0.8,ent.sz||0.3,ent.color||'#88a0b8',estOn?0.7:0.9);
  const p=project(ent.x||0,(ent.y||0)+(ent.sy||0.8)+0.12,ent.z||0); if(p[2]<0.4)continue; wctx.fillStyle='#d7e0ea'; wctx.font=(11*devicePixelRatio)+'px ui-sans-serif'; wctx.fillText(ent.name||'',p[0]+4,p[1]); }
}
function drawBars(csi){const w=bars.width,h=bars.height;bctx.fillStyle='#080b10';bctx.fillRect(0,0,w,h);if(!csi||!csi.length)return;
 const n=csi.length,bw=Math.max(2,(w-12)/n-2); for(let i=0;i<n;i++){const v=clamp01(csi[i]); bctx.fillStyle='rgb('+(20+220*v)+','+(80+140*(1-v))+','+40+')'; bctx.fillRect(6+i*(bw+2),h-4-v*(h-10),bw,v*(h-10));}}
function drawFall(csi){if(csi&&csi.length){water.push(csi.slice());if(water.length>48)water.shift();} const w=fall.width,h=fall.height;fctx.fillStyle='#080b10';fctx.fillRect(0,0,w,h);if(!water.length)return;
 const rows=water.length,cols=water[0].length,rw=h/rows,cw=(w-4)/cols; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){const v=clamp01(water[r][c]); fctx.fillStyle='rgb('+(10+30*v)+','+(20+200*v)+','+40+')'; fctx.fillRect(2+c*cw,r*rw,Math.max(1,cw-0.4),Math.max(1,rw-0.3));}}
function setM(id,tId,v){v=clamp01(v);document.getElementById(id).style.width=(v*100).toFixed(1)+'%';document.getElementById(tId).textContent=v.toFixed(2);}
async function pull(){try{const r=await fetch('/state',{cache:'no-store'});state=await r.json(); const latest=state.latest||{},est=state.estimate||{},badge=document.getElementById('badge');
 if(!state.packets){badge.className='badge wait';badge.textContent='WAIT';}
 else if(state.view==='est'){badge.className=est.live?'badge live':'badge syn';badge.textContent=est.live?'EST LIVE':'EST SYN';}
 else {badge.className=latest.synthetic?'badge syn':'badge live';badge.textContent=latest.synthetic?'SYN':'LIVE';}
 document.getElementById('src').textContent=latest.body_id||'';
 document.getElementById('stats').textContent='pkts '+(state.packets||0)+'  tracks '+((est.blobs||[]).length)+'  t '+Number(state.sim_t||0).toFixed(2)+'s';
 document.getElementById('hint').textContent=state.view==='est'?(state.jsonl_missing?'EST tracking synthetic CSI':'EST tracking live CSI'):'SYN demo world';
 drawBars(latest.csi);drawFall(latest.csi); setM('m_rssi','t_rssi',latest.rssi);setM('m_e','t_e',latest.energy);setM('m_m','t_m',est.motion);
 document.getElementById('elist').innerHTML=(est.blobs||[]).length?est.blobs.map(b=>'<div><b>T'+(b.id||0)+'</b> E='+Number(b.energy).toFixed(2)+' age='+Number(b.age||0).toFixed(1)+'</div>').join(''):'no tracks';
 document.getElementById('list').innerHTML=(state.world||[]).map(e=>'<div><b>'+e.name+'</b> '+e.kind+'</div>').join('')||'empty';
 document.getElementById('btn-syn').className=state.view==='syn'?'on-syn':''; document.getElementById('btn-est').className=state.view==='est'?'on-est':'';}catch(e){}}
let lastPull=0; function frame(now){const t=now*0.001; if(now-lastPull>50){pull();lastPull=now;} lerpShown(); spawnParts(); drawWorld(t); requestAnimationFrame(frame);} requestAnimationFrame(frame);
</script></html>
